name: Metrics

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.isocalendar.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: output
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
